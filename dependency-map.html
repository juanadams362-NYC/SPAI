<style>
  :root {
    --bg: #F4F6FA;
    --surface: #FFFFFF;
    --surface-2: #EAEEF4;
    --border: #DCE1EA;
    --text: #161B22;
    --text-dim: #5B6472;
    --text-faint: #8891A0;
    --accent: #2B6CE0;
    --accent-soft: rgba(43, 108, 224, 0.12);

    --cat-view: #B8801F;
    --cat-service: #1D8C77;
    --cat-model: #6B5FD1;
    --cat-test: #B9457B;
    --cat-structural: #7A8496;

    --shadow: 0 8px 28px rgba(22, 27, 34, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0F16;
      --surface: #11161F;
      --surface-2: #171D28;
      --border: #262E3B;
      --text: #E7EAF0;
      --text-dim: #98A2B3;
      --text-faint: #626C7C;
      --accent: #4FA8FF;
      --accent-soft: rgba(79, 168, 255, 0.14);

      --cat-view: #E0A64C;
      --cat-service: #4FBFA8;
      --cat-model: #9B8FEF;
      --cat-test: #D97BA6;
      --cat-structural: #8B94A3;

      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0F16;
    --surface: #11161F;
    --surface-2: #171D28;
    --border: #262E3B;
    --text: #E7EAF0;
    --text-dim: #98A2B3;
    --text-faint: #626C7C;
    --accent: #4FA8FF;
    --accent-soft: rgba(79, 168, 255, 0.14);

    --cat-view: #E0A64C;
    --cat-service: #4FBFA8;
    --cat-model: #9B8FEF;
    --cat-test: #D97BA6;
    --cat-structural: #8B94A3;

    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .mono {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  #app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }

  /* ---------- Rail ---------- */
  #rail {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #rail-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  #rail-header h1 {
    margin: 0 0 3px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #rail-header .sub {
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.5;
  }
  #meta-line {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .tag.dirty { color: var(--cat-test); border-color: var(--cat-test); }

  #stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    background: var(--surface);
    padding: 12px 10px;
    text-align: left;
  }
  .stat .n {
    font-size: 19px;
    font-weight: 600;
    font-family: "IBM Plex Mono", monospace;
    display: block;
  }
  .stat .l {
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
    display: block;
  }

  #search-block {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  #search {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #search-count {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-faint);
  }

  #legend {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  #legend .h {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }
  .legend-row:hover { background: var(--surface-2); }
  .legend-row.off { opacity: 0.35; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-row .count { margin-left: auto; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; font-size: 11px; }

  #list-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 10px 16px;
  }
  #list-wrap .h {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    padding: 10px 6px 6px;
  }
  .file-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .file-row:hover { background: var(--surface-2); }
  .file-row.active { background: var(--accent-soft); }
  .file-row .swatch { margin-top: 0; }
  .file-row .name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-row .deg {
    margin-left: auto;
    color: var(--text-faint);
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
  }

  /* ---------- Canvas ---------- */
  #canvas-wrap { position: relative; overflow: hidden; background: var(--bg); }
  #graph-svg { width: 100%; height: 100%; display: block; }

  .link { stroke: var(--text-faint); stroke-opacity: 0.28; fill: none; }
  .link.highlight { stroke: var(--accent); stroke-opacity: 0.85; }
  .link.dim { stroke-opacity: 0.05; }

  .node circle {
    stroke: var(--surface);
    stroke-width: 2px;
    cursor: pointer;
  }
  .node.dim circle { opacity: 0.16; }
  .node.dim text { opacity: 0.12; }
  .node.selected circle { stroke: var(--accent); stroke-width: 3px; }
  .node.entry circle { stroke: var(--accent); stroke-width: 3px; stroke-dasharray: 2 2; }

  .node text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    fill: var(--text-dim);
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 3px;
  }
  .node.highlight text { fill: var(--text); font-weight: 600; }

  #toolbar {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 5;
  }
  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .btn:hover { color: var(--text); border-color: var(--accent); }
  .btn:focus-visible, #search:focus-visible, .legend-row:focus-visible, .file-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #hint {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 11.5px;
    color: var(--text-faint);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 7px;
    box-shadow: var(--shadow);
  }

  /* ---------- Detail drawer ---------- */
  #drawer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 380px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  #drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }

  #drawer-header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  #drawer-header .path {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-all;
  }
  #drawer-close {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 4px;
    margin-left: auto;
  }
  #drawer-close:hover { color: var(--text); }

  #drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }
  .drawer-section { margin-bottom: 20px; }
  .drawer-section .h {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-size: 11px;
    font-family: "IBM Plex Mono", monospace;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .decl-row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 3px 0;
    font-size: 12.5px;
  }
  .decl-kind {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
    width: 62px;
    flex-shrink: 0;
  }
  .decl-name { font-family: "IBM Plex Mono", monospace; }

  .dep-row {
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .dep-row:hover { background: var(--surface-2); }
  .dep-row .name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    display: block;
  }
  .dep-row .via {
    color: var(--text-faint);
    font-size: 10.5px;
    margin-top: 1px;
  }
  .empty-note { color: var(--text-faint); font-size: 12px; font-style: italic; }
</style>

<div id="app">
  <div id="rail">
    <div id="rail-header">

    <div id="list-wrap">
      <div class="h">Files by connections</div>
      <div id="file-list"></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <svg id="graph-svg"></svg>
    <div id="toolbar">
      <button class="btn" id="btn-reset">Reset view</button>
    </div>
    <div id="hint">Drag to pan · scroll to zoom · click a node for details</div>
    <div id="drawer">
      <div id="drawer-header">
        <div class="path" id="drawer-path"></div>
        <button id="drawer-close" aria-label="Close">✕</button>
      </div>
      <div id="drawer-body"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const raw = JSON.parse(document.getElementById('graph-data').textContent);

  const CAT_LABEL = {
    view: 'View', service: 'Service', model: 'Model', test: 'Test',
    'design-system': 'Design system', 'app-entry': 'App entry',
    infrastructure: 'Infrastructure', extension: 'Extension',
    other: 'Other', 'package-manifest': 'Package manifest'
  };
  const STRUCTURAL = new Set(['design-system', 'app-entry', 'infrastructure', 'extension', 'other', 'package-manifest']);
  function catToken(cat) {
    if (cat === 'view') return '--cat-view';
    if (cat === 'service') return '--cat-service';
    if (cat === 'model') return '--cat-model';
    if (cat === 'test') return '--cat-test';
    return '--cat-structural';
  }
  function catColor(cat) {
    return getComputedStyle(document.documentElement).getPropertyValue(catToken(cat)).trim();
  }

  const nodesById = new Map();
  raw.nodes.forEach(n => nodesById.set(n.id, Object.assign({}, n, {
    short: n.id.split('/').pop(),
    inDeg: 0, outDeg: 0
  })));

  const links = raw.edges.map(e => ({ source: e.from, target: e.to, via: e.via }));
  links.forEach(l => {
    const s = nodesById.get(l.source), t = nodesById.get(l.target);
    if (s) s.outDeg++;
    if (t) t.inDeg++;
  });

  const nodes = Array.from(nodesById.values());
  nodes.forEach(n => { n.degree = n.inDeg + n.outDeg; });

  // ---- Meta / stats ----
  const metaLine = document.getElementById('meta-line');
  const dirty = raw.working_tree_dirty;
  metaLine.innerHTML =
    '<span class="tag mono">' + (raw.generated_from_branch || 'unknown') + '@' + (raw.generated_from_commit || '—') + '</span>' +
    (dirty ? '<span class="tag dirty">uncommitted changes</span>' : '<span class="tag">clean tree</span>');

  const statsEl = document.getElementById('stats');
  const s = raw.stats;
  [['files', s.file_count], ['types', s.type_count], ['edges', s.edge_count]].forEach(([label, val]) => {
    const d = document.createElement('div');
    d.className = 'stat';
    d.innerHTML = '<span class="n mono">' + val + '</span><span class="l">' + label + '</span>';
    statsEl.appendChild(d);
  });

  // ---- Legend ----
  const activeCats = new Set(Object.keys(CAT_LABEL));
  const catCounts = {};
  nodes.forEach(n => { catCounts[n.category] = (catCounts[n.category] || 0) + 1; });
  const legendEl = document.getElementById('legend-rows');
  const presentCats = Object.keys(CAT_LABEL).filter(c => catCounts[c]);
  // Group rare structural categories under their real names but keep visual grouping.
  presentCats.sort((a, b) => (catCounts[b] || 0) - (catCounts[a] || 0));
  presentCats.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.tabIndex = 0;
    row.dataset.cat = cat;
    row.innerHTML = '<span class="swatch" style="background:var(' + catToken(cat) + ')"></span>' +
      '<span>' + CAT_LABEL[cat] + '</span>' +
      '<span class="count mono">' + catCounts[cat] + '</span>';
    row.addEventListener('click', () => toggleCategory(cat, row));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCategory(cat, row); } });
    legendEl.appendChild(row);
  });

  function toggleCategory(cat, row) {
    if (activeCats.has(cat)) { activeCats.delete(cat); row.classList.add('off'); }
    else { activeCats.add(cat); row.classList.remove('off'); }
    applyFilter();
  }

  // ---- File list ----
  const fileListEl = document.getElementById('file-list');
  const sortedNodes = [...nodes].sort((a, b) => b.degree - a.degree);
  const rowById = new Map();
  sortedNodes.forEach(n => {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.tabIndex = 0;
    row.innerHTML = '<span class="swatch" style="background:' + catColor(n.category) + '"></span>' +
      '<span class="name">' + n.short + '</span>' +
      '<span class="deg mono">' + n.degree + '</span>';
    row.addEventListener('click', () => selectNode(n.id));
    fileListEl.appendChild(row);
    rowById.set(n.id, row);
  });

  // ---- Force simulation ----
  const svg = d3.select('#graph-svg');
  const zoomLayer = svg.append('g');
  const linkLayer = zoomLayer.append('g').attr('class', 'links');
  const nodeLayer = zoomLayer.append('g').attr('class', 'nodes');

  function radiusFor(n) { return 5 + Math.sqrt(n.degree) * 3.2; }

  function size() {
    const wrap = document.getElementById('canvas-wrap');
    return [wrap.clientWidth, wrap.clientHeight];
  }
  let [W, H] = size();
  svg.attr('viewBox', [0, 0, W, H]);

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(l => 70 + (l.via ? l.via.length * 4 : 0)).strength(0.35))
    .force('charge', d3.forceManyBody().strength(-160))
    .force('collide', d3.forceCollide().radius(d => radiusFor(d) + 14))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('x', d3.forceX(W / 2).strength(0.03))
    .force('y', d3.forceY(H / 2).strength(0.03))
    .stop();

  // Settle before first paint so the graph is legible at rest, not a jumbled scatter.
  for (let i = 0; i < 260; i++) simulation.tick();

  const linkSel = linkLayer.selectAll('line')
    .data(links)
    .join('line')
    .attr('class', 'link')
    .attr('stroke-width', l => 0.6 + Math.min((l.via ? l.via.length : 1), 4) * 0.35);

  const nodeSel = nodeLayer.selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', d => 'node' + (d.category === 'app-entry' ? ' entry' : ''))
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  nodeSel.append('circle')
    .attr('r', radiusFor)
    .attr('fill', d => catColor(d.category));

  nodeSel.append('text')
    .attr('x', d => radiusFor(d) + 4)
    .attr('y', 3)
    .text(d => d.short);

  nodeSel.on('click', (event, d) => { event.stopPropagation(); selectNode(d.id); });
  nodeSel.append('title').text(d => d.id + '\n' + CAT_LABEL[d.category] + ' · ' + d.lines + ' lines · ' + d.degree + ' connections');

  function place() {
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
  }
  place();
  simulation.on('tick', place);

  // ---- Zoom / pan ----
  const zoom = d3.zoom().scaleExtent([0.2, 4]).on('zoom', (event) => {
    zoomLayer.attr('transform', event.transform);
  });
  svg.call(zoom);

  function fitToView(animate) {
    // The wrapping grid column can report a 0×0 box for a frame or two before the
    // browser commits layout — a zoom transform built from that divides by zero and
    // scales the whole graph to nothing. Re-measure here rather than trust the value
    // captured at script start, and refuse to act on a box that still isn't real.
    [W, H] = size();
    if (!(W > 0) || !(H > 0)) { requestAnimationFrame(() => fitToView(animate)); return; }
    svg.attr('viewBox', [0, 0, W, H]);

    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = 60;
    const w = Math.max(maxX - minX, 1) + pad * 2;
    const h = Math.max(maxY - minY, 1) + pad * 2;
    // Clamp away from 0 as a second line of defense: a valid but tiny scale is a small
    // graph, a zero scale is an invisible one, and only the second is actually a bug.
    const scale = Math.min(Math.max(Math.min(W / w, H / h, 1.3), 0.08), 4);
    const tx = W / 2 - scale * (minX + maxX) / 2;
    const ty = H / 2 - scale * (minY + maxY) / 2;
    const target = d3.zoomIdentity.translate(tx, ty).scale(scale);
    if (animate === false) svg.call(zoom.transform, target);
    else svg.transition().duration(400).call(zoom.transform, target);
  }
  requestAnimationFrame(() => fitToView(false));
  document.getElementById('btn-reset').addEventListener('click', () => fitToView(true));

  window.addEventListener('resize', () => {
    [W, H] = size();
    svg.attr('viewBox', [0, 0, W, H]);
  });

  // ---- Filtering (search + category) ----
  const linkBySourceTarget = links;
  function applyFilter() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    let matchCount = 0;
    nodeSel.each(function (d) {
      const catOn = activeCats.has(d.category);
      const textMatch = !q || d.short.toLowerCase().includes(q) ||
        d.declares.some(x => x.name.toLowerCase().includes(q));
      const visible = catOn && textMatch;
      if (visible) matchCount++;
      d3.select(this).classed('dim', !visible).classed('highlight', visible && q.length > 0);
      const row = rowById.get(d.id);
      if (row) row.style.display = catOn ? '' : 'none';
    });
    linkSel.each(function (l) {
      const sOn = activeCats.has(l.source.category) && (!q || l.source.short.toLowerCase().includes(q) || l.source.declares.some(x => x.name.toLowerCase().includes(q)));
      const tOn = activeCats.has(l.target.category) && (!q || l.target.short.toLowerCase().includes(q) || l.target.declares.some(x => x.name.toLowerCase().includes(q)));
      d3.select(this).classed('dim', !(sOn && tOn));
    });
    document.getElementById('search-count').textContent = q ? matchCount + ' of ' + nodes.length + ' files match' : '';
  }
  document.getElementById('search').addEventListener('input', applyFilter);

  // ---- Selection + drawer ----
  let selectedId = null;
  const drawer = document.getElementById('drawer');
  function selectNode(id) {
    selectedId = id;
    nodeSel.classed('selected', d => d.id === id);
    document.querySelectorAll('.file-row.active').forEach(r => r.classList.remove('active'));
    const row = rowById.get(id);
    if (row) { row.classList.add('active'); row.scrollIntoView({ block: 'nearest' }); }

    linkSel.classed('highlight', l => l.source.id === id || l.target.id === id);
    linkSel.classed('dim', l => !(l.source.id === id || l.target.id === id) && drawer.classList.contains('open'));

    renderDrawer(nodesById.get(id));
    drawer.classList.add('open');
  }
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  function closeDrawer() {
    drawer.classList.remove('open');
    selectedId = null;
    nodeSel.classed('selected', false);
    document.querySelectorAll('.file-row.active').forEach(r => r.classList.remove('active'));
    linkSel.classed('highlight', false).classed('dim', false);
  }
  svg.on('click', closeDrawer);

  function renderDrawer(n) {
    document.getElementById('drawer-path').textContent = n.id;

    const incoming = links.filter(l => l.target.id === n.id);
    const outgoing = links.filter(l => l.source.id === n.id);

    const body = document.getElementById('drawer-body');
    const catPill = '<span class="pill" style="color:' + catColor(n.category) + ';border-color:' + catColor(n.category) + '">' + CAT_LABEL[n.category] + '</span>';
    const linesPill = '<span class="pill">' + n.lines + ' lines</span>';

    let html = '<div class="drawer-section"><div class="pill-row">' + catPill + linesPill + '</div></div>';

    html += '<div class="drawer-section"><div class="h">Imports (' + n.imports.length + ')</div>';
    html += n.imports.length
      ? '<div class="pill-row">' + n.imports.map(i => '<span class="pill">' + i + '</span>').join('') + '</div>'
      : '<div class="empty-note">none</div>';
    html += '</div>';

    html += '<div class="drawer-section"><div class="h">Declares (' + n.declares.length + ')</div>';
    html += n.declares.length
      ? n.declares.map(d => '<div class="decl-row"><span class="decl-kind">' + d.kind + '</span><span class="decl-name">' + d.name + '</span></div>').join('')
      : '<div class="empty-note">none</div>';
    html += '</div>';

    html += '<div class="drawer-section"><div class="h">Depended on by (' + incoming.length + ')</div>';
    html += incoming.length
      ? incoming.map(l => '<div class="dep-row" data-id="' + l.source.id + '"><span class="name">' + l.source.short + '</span><span class="via">via ' + l.via.join(', ') + '</span></div>').join('')
      : '<div class="empty-note">nothing else references this file</div>';
    html += '</div>';

    html += '<div class="drawer-section"><div class="h">Depends on (' + outgoing.length + ')</div>';
    html += outgoing.length
      ? outgoing.map(l => '<div class="dep-row" data-id="' + l.target.id + '"><span class="name">' + l.target.short + '</span><span class="via">via ' + l.via.join(', ') + '</span></div>').join('')
      : '<div class="empty-note">no dependencies on other project files</div>';
    html += '</div>';

    body.innerHTML = html;
    body.querySelectorAll('.dep-row').forEach(row => {
      row.addEventListener('click', (e) => { e.stopPropagation(); selectNode(row.dataset.id); });
    });
  }

  // Open on the most-connected file so the drawer isn't empty at rest.
  selectNode(sortedNodes[0].id);
})();
</script>
