<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAI · Instructor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Same ink-and-paper system as the marketing site, so the product an
   instructor signs in to looks like the one they were shown. */
:root {
  --ink: #0b0a09; --ink-2: #151310; --ink-3: #1e1b18;
  --paper: #f2efe9; --stone: #bdb7ad; --ash: #8a847b;
  --line: rgba(242, 239, 233, .14); --line-strong: rgba(242, 239, 233, .32);
  --good: #7fd3a4; --warn: #e8b458; --bad: #ef7d6f; --idle: #8a847b;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--paper); }
body { font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.shell { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 96px; }
header.top { display: flex; align-items: center; gap: 28px; padding: 22px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mark { font: 300 22px/1 var(--f-display); letter-spacing: .34em; text-decoration: none; font-stretch: 110%; }
.mark small { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; color: var(--ash); margin-left: 14px; text-transform: uppercase; }
nav { display: flex; gap: 22px; flex: 1; flex-wrap: wrap; }
nav a { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; color: var(--stone); padding: 8px 0; border-bottom: 1px solid transparent; }
nav a[aria-current="page"] { color: var(--paper); border-color: var(--paper); }
.btn { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; }
.btn:hover { border-color: var(--paper); }
.btn.solid { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn.danger { border-color: rgba(239,125,111,.5); color: var(--bad); }
.btn:disabled { opacity: .4; cursor: default; }

.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ash); margin: 0 0 14px; }
h1 { font: 800 clamp(34px, 6vw, 68px)/.95 var(--f-display); font-stretch: 118%; text-transform: uppercase; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h1 .thin { font-weight: 200; display: block; }
h2 { font: 700 20px/1.2 var(--f-display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 16px; }
section { padding: 44px 0 0; }
.lede { color: var(--stone); max-width: 62ch; margin: 18px 0 0; font-size: 17px; }

.banner { margin-top: 20px; padding: 14px 18px; border: 1px solid var(--line-strong); border-radius: 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 15px; color: var(--stone); }
.banner b { color: var(--paper); font-weight: 600; }
.banner.warn { border-color: rgba(232,180,88,.5); }
.banner .sp { flex: 1; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.stat { padding: 22px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .n { font: 800 44px/1 var(--f-display); font-stretch: 112%; font-variant-numeric: tabular-nums; }
.stat .n small { font: 400 18px var(--f-body); color: var(--ash); }
.stat .l { font: 500 11px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ash); margin-top: 12px; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; }
.card { border: 1px solid var(--line); border-radius: 18px; padding: 24px; min-width: 0; background: var(--ink-2); }
.trouble { display: grid; gap: 14px; }
.trow { display: grid; grid-template-columns: 15ch minmax(0, 1fr) 3ch; gap: 14px; align-items: center; font-size: 15px; }
.trow .bar { height: 10px; border-radius: 5px; background: var(--ink-3); overflow: hidden; }
.trow .bar i { display: block; height: 100%; background: var(--stone); border-radius: 5px; }
.trow.max .bar i { background: var(--warn); }
.trow b { text-align: right; font: 500 14px var(--f-mono); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 640px; }
th { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ash); text-align: left; padding: 16px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--ink-2); }
td.name { font-weight: 600; }
td.name small { display: block; font: 400 12px var(--f-mono); color: var(--ash); margin-top: 2px; }
.num { text-align: right; }
.muted { color: var(--ash); }

.pill { display: inline-flex; align-items: center; gap: 7px; font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; padding: 7px 11px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.competent { color: var(--good); } .pill.needs_practice { color: var(--warn); }
.pill.incomplete, .pill.none { color: var(--idle); } .pill.sample { color: var(--stone); }
.pill.needs_practice::before { border-radius: 1px; transform: rotate(45deg); }
.pill.incomplete::before, .pill.none::before { background: transparent; border: 1.5px solid currentColor; }
.spark { display: block; }

.crumb { font: 500 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ash); text-decoration: none; display: inline-block; margin-bottom: 18px; }
.headrow { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
.headrow .sp { flex: 1; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

.stations { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.st { border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.st .k { font: 500 10px/1 var(--f-mono); letter-spacing: .12em; color: var(--ash); }
.st .t { font-weight: 600; margin: 8px 0 10px; font-size: 14px; }
.st.clean { border-color: rgba(127,211,164,.5); } .st.issue { border-color: rgba(232,180,88,.6); } .st.todo { opacity: .55; }
.st .s { font: 500 11px/1.4 var(--f-mono); color: var(--stone); }
ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
ul.plain li { padding-left: 18px; position: relative; color: var(--stone); }
ul.plain li::before { content: "→"; position: absolute; left: 0; color: var(--ash); }
.timeline { display: grid; gap: 0; }
.ev { display: grid; grid-template-columns: 9ch 18px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.ev:last-child { border: 0; }
.ev time { font: 400 12px/1.6 var(--f-mono); color: var(--ash); }
.ev i { width: 9px; height: 9px; border-radius: 50%; background: var(--ash); margin-top: 7px; }
.ev.contamination i, .ev.send_back i, .ev.count_mismatch i { background: var(--bad); }
.ev.station_complete i { background: var(--good); } .ev.redo i { background: var(--warn); }
.ded { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ded:last-child { border: 0; } .ded b { font: 500 15px var(--f-mono); color: var(--bad); }
.score { font: 800 84px/1 var(--f-display); font-stretch: 112%; }

.field { display: grid; gap: 8px; margin-bottom: 14px; }
.field label, .lab { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
input[type=text], input[type=password], input[type=number], textarea, select { background: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 13px; width: 100%; }
textarea { resize: vertical; min-height: 62px; line-height: 1.45; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr) 190px 42px; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.step .n { font: 500 13px/42px var(--f-mono); color: var(--ash); }
.step .why { grid-column: 2 / 4; }
.step button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-strong); background: none; cursor: pointer; }
.rub { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
.msg { margin-top: 14px; font-size: 15px; } .msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
.signin { max-width: 420px; margin: 12vh auto 0; }
.empty { padding: 40px 24px; text-align: center; color: var(--stone); }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); }
  .step { grid-template-columns: 24px minmax(0, 1fr) 42px; } .step select { grid-column: 2 / 3; } .step .why { grid-column: 2 / 3; } .stat { border-right: 0; border-bottom: 1px solid var(--line); } }
@media print { header.top, .actions, .banner, .crumb { display: none !important; } html, body { background: #fff; color: #000; }
  :root { --paper: #000; --stone: #333; --ash: #555; --line: #ccc; --line-strong: #999; --ink-2: #fff; --ink-3: #eee; } }

.who { font: 500 12px/1.5 var(--f-mono); color: var(--stone); letter-spacing: .04em; text-align: right; }
.who b { color: var(--paper); font-weight: 500; }
.code { font: 700 clamp(36px, 8vw, 68px)/1 var(--f-mono); letter-spacing: .12em; margin: 10px 0 6px; }
.pinsheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.pincard { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 16px; break-inside: avoid; }
.pincard .p { font: 700 30px/1 var(--f-mono); letter-spacing: .2em; margin-top: 8px; }
.pincard small { display: block; font: 400 12px var(--f-mono); color: var(--ash); margin-top: 6px; }
.flag { font: 500 11px var(--f-mono); color: var(--warn); letter-spacing: .06em; }
.linkbox { font: 400 13px var(--f-mono); word-break: break-all; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px; }
.readonly { opacity: .75; pointer-events: none; }
@media print { .who, nav { display: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="mark" href="#class">SPAI<small>Instructor</small></a>
    <nav id="nav" hidden>
      <a href="#class" data-view="class">Class</a>
      <a href="#headsets" data-view="headsets">Headsets</a>
      <a href="#team" data-view="team">Team</a>
      <a href="#protocol" data-view="protocol">Protocol</a>
      <a href="#privacy" data-view="privacy">Privacy + data</a>
    </nav>
    <div class="who" id="who" hidden></div>
    <button class="btn" id="signout" hidden>Sign out</button>
  </header>
  <main id="main"></main>
</div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const main = $('#main');
// Everything a learner or instructor typed goes through this before it reaches the page.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STATION_NUM = { decontamination: '01', inspection: '02', tray_assembly: '03', packaging: '04', seal_validation: '05' };
const CHECKS = { manual: 'Student confirms', gloves_on: 'Camera: gloves on', instruments_present: 'Camera: instruments in view',
                 tray_loaded: 'Camera: tray loaded', count_matches: 'Camera: count matches sheet' };
const RUBRIC = { contamination_penalty: 'Points lost per contamination', send_back_penalty: 'Points lost per tray sent back',
                 redo_penalty: 'Points lost per station redone', count_mismatch_penalty: 'Points lost per count mismatch',
                 pass_score: 'Score needed to be competent', max_contaminations_to_pass: 'Contaminations allowed and still competent' };

async function api(path, options = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...options,
    headers: options.body ? { 'Content-Type': 'application/json', ...(options.headers || {}) } : options.headers });
  if (res.status === 401 && path.startsWith('/instructor/api/')) { signedIn = false; render(); throw new Error('Your sign-in ended. Sign in again.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'That didn’t work. Try again.');
  return data;
}
const when = iso => iso ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '—';
const whenLong = iso => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const clock = iso => new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const mins = s => `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
const pill = (verdict, label) => `<span class="pill ${esc(verdict || 'none')}">${esc(label)}</span>`;

function spark(scores) {
  if (!scores || scores.length < 2) return '<span class="muted">—</span>';
  const w = 96, h = 28, step = w / (scores.length - 1);
  const pts = scores.map((v, i) => `${(i * step).toFixed(1)},${(h - 3 - (v / 100) * (h - 6)).toFixed(1)}`);
  const last = pts[pts.length - 1].split(',');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Scores over time: ${scores.join(', ')}">
    <polyline points="${pts.join(' ')}" fill="none" stroke="#bdb7ad" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#f2efe9"/></svg>`;
}

let signedIn = false, status = {};
const isAdmin = () => status.instructor && status.instructor.role === 'admin';
const msg = (el, text, ok) => { el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = text; };

/* ---------------- sign in ---------------- */
function viewSignIn() {
  main.innerHTML = `<div class="signin"><p class="eyebrow">Instructor dashboard</p>
    <h1 style="font-size:44px">Sign in</h1>
    <p class="lede">Use the work email and password for your SPAI account. New here? Your program's admin sends you an invite link.</p>
    <form id="f" style="margin-top:26px">
      <div class="field"><label for="email">Work email</label><input id="email" type="text" autocomplete="username" inputmode="email" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn solid">Sign in</button><p class="msg err" id="m" role="alert"></p></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try { await api('/instructor/login', { method: 'POST', body: JSON.stringify({ email: $('#email').value, password: $('#pw').value }) }); await boot(); }
    catch (err) { $('#m').textContent = err.message; }
  };
  $('#email').focus();
}

async function viewInvite(token) {
  let invite;
  try { invite = await api('/instructor/invite/' + encodeURIComponent(token)); }
  catch (err) { main.innerHTML = `<div class="signin"><h1 style="font-size:40px">Link expired</h1><p class="lede">${esc(err.message)}</p><a class="btn" href="#class" style="margin-top:20px">Go to sign in</a></div>`; return; }
  main.innerHTML = `<div class="signin"><p class="eyebrow">${esc(invite.org_name)}</p>
    <h1 style="font-size:44px">Set up your account</h1>
    <p class="lede">You've been invited as ${invite.role === 'admin' ? 'an admin' : 'an instructor'}. Your sign-in will be <b style="color:var(--paper)">${esc(invite.email)}</b>.</p>
    <form id="f" style="margin-top:26px">
      <div class="field"><label for="nm">Your name</label><input id="nm" type="text" maxlength="120" autocomplete="name" required></div>
      <div class="field"><label for="pw">Choose a password</label><input id="pw" type="password" minlength="10" autocomplete="new-password" required></div>
      <p class="muted" style="font-size:14px;margin:-4px 0 16px">At least 10 characters.</p>
      <button class="btn solid">Create account</button><p class="msg err" id="m" role="alert"></p></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try { await api('/instructor/invite/' + encodeURIComponent(token), { method: 'POST', body: JSON.stringify({ name: $('#nm').value, password: $('#pw').value }) });
          history.replaceState(null, '', '#class'); await boot(); }
    catch (err) { $('#m').textContent = err.message; }
  };
}

/* ---------------- PIN sheet ---------------- */
// PINs are shown once, right after they're issued. The sheet is meant to be
// printed and handed out, then the page left.
function pinSheet(rows, title) {
  return `<section><div class="headrow"><div><p class="eyebrow">Shown once</p><h2>${esc(title)}</h2></div><span class="sp"></span>
      <div class="actions"><button class="btn" onclick="window.print()">Print PIN cards</button><a class="btn solid" href="#class">Done</a></div></div>
    <p class="lede" style="margin-bottom:20px">Each learner picks their name on the headset and enters their PIN. SPAI only keeps a scrambled copy, so it can't show these again. If one is lost, issue a new PIN from the learner's page.</p>
    <div class="pinsheet">${rows.map(r => `<div class="pincard"><b>${esc(r.name)}</b><div class="p">${esc(r.pin)}</div><small>${esc(r.cohort || status.organization.name)}</small></div>`).join('')}</div></section>`;
}

/* ---------------- class ---------------- */
async function viewClass() {
  const o = await api('/instructor/api/overview');
  const maxIssues = Math.max(1, ...o.station_trouble.map(s => s.issues));
  const banners = [];
  if (!o.headsets) banners.push(`<div class="banner"><span><b>No headsets connected yet.</b> ${isAdmin() ? 'Connect one so students can sign in and their runs come here.' : 'Ask your admin to connect your program’s headsets.'}</span><span class="sp"></span>${isAdmin() ? '<a class="btn" href="#headsets">Connect a headset</a>' : ''}</div>`);
  if (o.has_demo_data) banners.push(`<div class="banner"><span><b>Sample data.</b> The "Sample cohort" learners and their runs are invented, for demonstration.</span><span class="sp"></span>${isAdmin() ? '<button class="btn" id="rmdemo">Remove sample data</button>' : ''}</div>`);

  const rows = o.roster.map(r => `<tr class="link" data-id="${esc(r.id)}" tabindex="0">
      <td class="name">${esc(r.name)}<small>${esc(r.cohort || 'No cohort')}${r.is_demo ? ' · sample' : ''}${r.locked ? ' · <span class="flag">PIN locked</span>' : ''}</small></td>
      <td>${pill(r.latest_verdict, r.latest_verdict_label)}${r.unconfirmed_runs ? ` <span class="flag" title="Signed in offline with the wrong PIN">${r.unconfirmed_runs} unconfirmed</span>` : ''}</td>
      <td class="num">${r.latest_score ?? '—'}</td><td class="num">${r.best_score ?? '—'}</td>
      <td class="num">${r.runs}</td><td>${spark(r.scores)}</td><td class="muted">${when(r.last_run_at)}</td></tr>`).join('');

  main.innerHTML = `${banners.join('')}
    <section><p class="eyebrow">${esc(status.organization.name)}</p>
      <div class="headrow"><h1><span class="thin">Who's ready,</span>who needs a hand.</h1><span class="sp"></span>
        <div class="actions"><a class="btn" href="/instructor/api/export.csv">Export CSV</a></div></div></section>
    <section><div class="stats">
      <div class="stat"><div class="n">${o.learners_competent}<small> / ${o.learners}</small></div><div class="l">Learners competent</div></div>
      <div class="stat"><div class="n">${o.sessions}</div><div class="l">Assessed runs</div></div>
      <div class="stat"><div class="n">${o.average_score ?? '—'}</div><div class="l">Average score, completed runs</div></div>
      <div class="stat"><div class="n">${o.contamination_events}</div><div class="l">Contamination alerts</div></div>
    </div></section>
    <section class="grid2">
      <div class="card"><h2>Where the class slips</h2>
        ${o.sessions ? `<div class="trouble">${o.station_trouble.map(s => `<div class="trow ${s.issues === maxIssues && s.issues ? 'max' : ''}">
          <span>${esc(s.title)}</span><div class="bar"><i style="width:${(s.issues / maxIssues * 100).toFixed(0)}%"></i></div><b>${s.issues}</b></div>`).join('')}</div>
          <p class="lede" style="font-size:15px">${o.hardest_station ? `Alerts, redos and send-backs across all runs. <b style="color:var(--paper)">${esc(o.hardest_station)}</b> is the one to re-teach first.` : 'No alerts, redos or send-backs recorded yet.'}</p>`
        : '<p class="muted">Appears after the first assessed run arrives from a headset.</p>'}</div>
      <div class="card"><h2>Add learners</h2>
        <form id="add"><div class="field"><label for="names">Names, one per line</label><textarea id="names" rows="4" required placeholder="Avery Chen&#10;Jordan Okafor"></textarea></div>
          <div class="field"><label for="cohort">Cohort or class</label><input id="cohort" type="text" maxlength="60" placeholder="Fall 2026 · Section A"></div>
          <button class="btn solid">Add and print PINs</button><p class="msg" id="addmsg" role="status"></p></form></div>
    </section>
    <section><h2>Roster</h2>
      ${o.roster.length ? `<div class="tablewrap"><table><thead><tr><th>Learner</th><th>Latest result</th><th class="num">Latest</th><th class="num">Best</th><th class="num">Runs</th><th>Trend</th><th>Last run</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : '<div class="card empty">No learners yet. Add your class above; each gets a 4-digit PIN to sign in on any of your headsets.</div>'}
    </section>`;

  main.querySelectorAll('tr.link').forEach(tr => { const go = () => location.hash = 'learner/' + tr.dataset.id; tr.onclick = go; tr.onkeydown = e => e.key === 'Enter' && go(); });
  $('#add').onsubmit = async e => {
    e.preventDefault();
    try {
      const names = $('#names').value.split('\n').map(s => s.trim()).filter(Boolean);
      const r = await api('/instructor/api/learners', { method: 'POST', body: JSON.stringify({ names, cohort: $('#cohort').value }) });
      main.innerHTML = pinSheet(r.added, `PINs for ${r.added.length} new learner${r.added.length === 1 ? '' : 's'}`); window.scrollTo(0, 0);
    } catch (err) { msg($('#addmsg'), err.message); }
  };
  const rm = $('#rmdemo'); if (rm) rm.onclick = async () => { await api('/instructor/api/demo', { method: 'DELETE' }); render(); };
}

/* ---------------- learner ---------------- */
async function viewLearner(id) {
  const { learner, sessions } = await api('/instructor/api/learners/' + encodeURIComponent(id));
  const assessed = sessions.filter(s => s.mode === 'assessed');
  const competent = assessed.some(s => s.verdict === 'competent' && s.identity === 'verified');
  const rows = sessions.map(s => `<tr class="link" data-id="${esc(s.id)}" tabindex="0"><td>${whenLong(s.started_at)}</td>
    <td>${pill(s.verdict, s.verdict_label)}${s.identity !== 'verified' ? ' <span class="flag">PIN not confirmed</span>' : ''}</td>
    <td class="num">${s.score}</td><td class="num">${s.stations_completed} / 5</td><td class="num">${s.contamination_count}</td><td class="num">${mins(s.duration_s)}</td></tr>`).join('');
  main.innerHTML = `<section><a class="crumb" href="#class">← Class</a>
      <div class="headrow"><div><p class="eyebrow">${esc(learner.cohort || 'No cohort')}${learner.is_demo ? ' · sample data' : ''}${learner.locked ? ' · PIN locked after wrong tries' : ''}</p><h1>${esc(learner.name)}</h1></div><span class="sp"></span>
        <div class="actions"><button class="btn" id="pin">New PIN</button><a class="btn" href="/instructor/api/learners/${encodeURIComponent(id)}/export">Export record</a>
          ${isAdmin() ? '<button class="btn danger" id="del">Delete learner</button>' : ''}</div></div>
      <p class="msg err" id="delmsg" role="alert"></p></section>
    <section><div class="stats">
      <div class="stat"><div class="n">${competent ? 'Yes' : 'Not yet'}</div><div class="l">Shown competent</div></div>
      <div class="stat"><div class="n">${assessed.length}</div><div class="l">Assessed runs</div></div>
      <div class="stat"><div class="n">${assessed.length ? Math.max(...assessed.map(s => s.score)) : '—'}</div><div class="l">Best score</div></div>
      <div class="stat"><div class="n">${spark(assessed.map(s => s.score).reverse())}</div><div class="l">Score, oldest to newest</div></div>
    </div></section>
    <section><h2>Runs</h2>${sessions.length ? `<div class="tablewrap"><table><thead><tr><th>When</th><th>Result</th><th class="num">Score</th><th class="num">Stations</th><th class="num">Contamination</th><th class="num">Time</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="card empty">No runs yet. They appear here as soon as this learner finishes an assessed run on a headset.</div>'}</section>`;
  main.querySelectorAll('tr.link').forEach(tr => { const go = () => location.hash = 'run/' + tr.dataset.id; tr.onclick = go; tr.onkeydown = e => e.key === 'Enter' && go(); });
  $('#pin').onclick = async () => {
    const r = await api(`/instructor/api/learners/${encodeURIComponent(id)}/reset-pin`, { method: 'POST' });
    main.innerHTML = pinSheet([{ ...r.learner, pin: r.pin }], `New PIN for ${r.learner.name}`); window.scrollTo(0, 0);
  };
  const del = $('#del'); let armed = false;
  if (del) del.onclick = async () => {
    // Two presses, not a browser dialog: the second press is the confirmation.
    if (!armed) { armed = true; del.textContent = 'Press again to erase everything'; $('#delmsg').textContent = `This permanently deletes ${learner.name} and all ${sessions.length} of their runs.`; return; }
    await api('/instructor/api/learners/' + encodeURIComponent(id), { method: 'DELETE' }); location.hash = 'class';
  };
}

/* ---------------- run ---------------- */
async function viewRun(id) {
  const s = await api('/instructor/api/sessions/' + encodeURIComponent(id));
  const r = s.result || {};
  const stations = (r.stations || []).map(st => {
    const issues = [st.contamination && `${st.contamination} contamination`, st.send_back && `${st.send_back} sent back`,
                    st.count_mismatch && `${st.count_mismatch} count mismatch`, st.redo && `${st.redo} redo`].filter(Boolean);
    const cls = !st.completed ? 'todo' : st.clean ? 'clean' : 'issue';
    return `<div class="st ${cls}"><div class="k">${STATION_NUM[st.station] || ''}</div><div class="t">${esc(st.title)}</div>
      <div class="s">${!st.completed ? 'Not completed' : st.clean ? 'Clean' : esc(issues.join(' · '))}</div></div>`;
  }).join('');
  main.innerHTML = `<section><a class="crumb" href="${s.learner_id ? '#learner/' + encodeURIComponent(s.learner_id) : '#class'}">← ${esc(s.learner_name)}</a>
      ${s.identity !== 'verified' ? '<div class="banner warn"><span><b>PIN not confirmed.</b> This run was started offline and the PIN entered didn’t match when it arrived. It doesn’t count toward competency.</span></div>' : ''}
      <div class="headrow"><div><p class="eyebrow">${whenLong(s.started_at)} · ${mins(s.duration_s)} · ${esc(s.headset || 'headset')}</p>
        <h1><span class="thin">${esc(s.learner_name)}</span>${esc(s.verdict_label)}</h1></div><span class="sp"></span>
        <div class="actions"><button class="btn" onclick="window.print()">Print report</button></div></div></section>
    <section class="grid2">
      <div class="card"><h2>Stations</h2><div class="stations">${stations}</div>
        <h2 style="margin-top:28px">What to coach</h2><ul class="plain">${(r.coaching || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>
      <div class="card"><p class="eyebrow">Score</p><div class="score">${s.score}</div>
        <div style="margin-top:18px">${(r.deductions || []).length ? r.deductions.map(d => `<div class="ded"><span>${esc(d.reason)}${d.count > 1 ? ' × ' + d.count : ''}</span><b>−${d.points}</b></div>`).join('') : '<p class="muted">No points lost.</p>'}</div>
        ${s.instruments_seen.length ? `<p class="eyebrow" style="margin-top:24px">Instruments recognised</p><p class="muted" style="margin:0">${s.instruments_seen.map(esc).join(' · ')}</p>` : ''}</div>
    </section>
    <section><h2>What happened</h2><div class="card timeline">${s.events.length ? s.events.map(e => `<div class="ev ${esc(e.kind)}"><time>${clock(e.at)}</time><i></i><span>${esc(e.message || e.kind)}</span></div>`).join('') : '<p class="muted">No events were recorded for this run.</p>'}</div></section>`;
}

/* ---------------- headsets ---------------- */
async function viewHeadsets() {
  const { headsets } = await api('/instructor/api/headsets');
  const rows = headsets.map(h => `<tr><td class="name">${esc(h.name)}<small>Connected ${when(h.created_at)}</small></td>
      <td class="muted">${h.last_seen_at ? 'Last seen ' + whenLong(h.last_seen_at) : 'Not seen yet'}</td>
      <td style="text-align:right">${isAdmin() ? `<button class="btn danger" data-revoke="${esc(h.id)}">Disconnect</button>` : ''}</td></tr>`).join('');
  main.innerHTML = `<section><p class="eyebrow">Headsets</p><h1><span class="thin">Every headset,</span>signed in to your school.</h1>
      <p class="lede">A connected headset can show your roster to students, check their PINs and send their runs here. Disconnecting one stops it immediately; the runs it already sent stay.</p></section>
    ${isAdmin() ? `<section class="card" id="pairbox"><h2>Connect a headset</h2>
        <p class="muted" style="margin-top:0">On the headset, open SPAI → Connect to your school, and enter the server address and code below. The code works once and lasts ten minutes.</p>
        <button class="btn solid" id="newcode">Show a pairing code</button><div id="codeout" role="status"></div></section>` : ''}
    <section><h2>Connected</h2>${headsets.length ? `<div class="tablewrap"><table><thead><tr><th>Headset</th><th>Activity</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="card empty">No headsets connected yet.</div>'}<p class="msg" id="hmsg" role="status"></p></section>`;
  const nc = $('#newcode');
  if (nc) nc.onclick = async () => {
    const c = await api('/instructor/api/headsets/pairing-code', { method: 'POST' });
    $('#codeout').innerHTML = `<p class="eyebrow" style="margin-top:24px">Server address</p><div class="linkbox">${esc(c.server)}</div>
      <p class="eyebrow" style="margin-top:20px">Pairing code</p><div class="code">${esc(c.code)}</div><p class="muted">Expires at ${new Date(c.expires_at * 1000).toLocaleTimeString()}. Refresh this page after pairing to see the headset in the list.</p>`;
  };
  main.querySelectorAll('[data-revoke]').forEach(btn => { let armed = false; btn.onclick = async () => {
    if (!armed) { armed = true; btn.textContent = 'Press again'; return; }
    await api('/instructor/api/headsets/' + encodeURIComponent(btn.dataset.revoke), { method: 'DELETE' }); render();
  }; });
}

/* ---------------- team ---------------- */
async function viewTeam() {
  const { instructors, you } = await api('/instructor/api/team');
  const activity = isAdmin() ? (await api('/instructor/api/activity')).events : [];
  const rows = instructors.map(m => `<tr><td class="name">${esc(m.name)}<small>${esc(m.email)}</small></td>
      <td>${m.role === 'admin' ? 'Admin' : 'Instructor'}${m.disabled ? ' · <span class="flag">no access</span>' : ''}</td>
      <td style="text-align:right">${isAdmin() && m.id !== you ? `<div class="actions" style="justify-content:flex-end">
        <button class="btn" data-role="${esc(m.id)}" data-to="${m.role === 'admin' ? 'instructor' : 'admin'}">Make ${m.role === 'admin' ? 'instructor' : 'admin'}</button>
        <button class="btn ${m.disabled ? '' : 'danger'}" data-access="${esc(m.id)}" data-off="${m.disabled ? 'false' : 'true'}">${m.disabled ? 'Restore access' : 'Remove access'}</button></div>` : m.id === you ? '<span class="muted">You</span>' : ''}</td></tr>`).join('');
  main.innerHTML = `<section><p class="eyebrow">${esc(status.organization.name)}</p><h1><span class="thin">Who can see</span>your students.</h1>
      <p class="lede">Instructors can see the class, add learners and issue PINs. Admins can also connect headsets, invite people, edit the protocol and delete records.</p></section>
    <section><div class="tablewrap"><table><thead><tr><th>Name</th><th>Access</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><p class="msg" id="tmsg" role="status"></p></section>
    <section class="grid2">
      ${isAdmin() ? `<div class="card"><h2>Invite someone</h2><form id="inv">
          <div class="field"><label for="iemail">Their work email</label><input id="iemail" type="text" inputmode="email" required></div>
          <div class="field"><label for="irole">Access</label><select id="irole"><option value="instructor">Instructor</option><option value="admin">Admin</option></select></div>
          <button class="btn solid">Create invite link</button><div id="invout" role="status"></div></form></div>` : ''}
      <div class="card"><h2>Your password</h2><form id="pwf">
          <div class="field"><label for="cur">Current password</label><input id="cur" type="password" autocomplete="current-password" required></div>
          <div class="field"><label for="npw">New password</label><input id="npw" type="password" minlength="10" autocomplete="new-password" required></div>
          <button class="btn">Change password</button><p class="msg" id="pwmsg" role="status"></p></form>
          <p class="muted" style="font-size:14px">Changing it signs you out of every other browser.</p></div>
    </section>
    ${isAdmin() ? `<section><h2>Activity</h2><div class="card timeline">${activity.length ? activity.map(e => `<div class="ev"><time>${when(e.at)}</time><i></i><span><b style="font-weight:600">${esc(e.actor)}</b> ${esc(e.action)}${e.detail ? ' · <span class="muted">' + esc(e.detail) + '</span>' : ''}</span></div>`).join('') : '<p class="muted">Nothing yet.</p>'}</div></section>` : ''}`;
  const inv = $('#inv');
  if (inv) inv.onsubmit = async e => {
    e.preventDefault();
    try { const r = await api('/instructor/api/team/invite', { method: 'POST', body: JSON.stringify({ email: $('#iemail').value, role: $('#irole').value }) });
      $('#invout').innerHTML = `<p class="muted" style="margin:16px 0 8px">Send this link to them. It works once, for ${r.expires_in_days} days.</p><div class="linkbox" id="lnk">${esc(r.link)}</div><button type="button" class="btn" id="cp" style="margin-top:10px">Copy link</button>`;
      $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(r.link); $('#cp').textContent = 'Copied'; } catch { getSelection().selectAllChildren($('#lnk')); } };
    } catch (err) { $('#invout').innerHTML = `<p class="msg err">${esc(err.message)}</p>`; }
  };
  $('#pwf').onsubmit = async e => {
    e.preventDefault();
    try { await api('/instructor/api/account/password', { method: 'POST', body: JSON.stringify({ current: $('#cur').value, new: $('#npw').value }) }); msg($('#pwmsg'), 'Password changed.', true); e.target.reset(); }
    catch (err) { msg($('#pwmsg'), err.message); }
  };
  const update = async (id, body) => { try { await api('/instructor/api/team/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify(body) }); render(); } catch (err) { msg($('#tmsg'), err.message); } };
  main.querySelectorAll('[data-role]').forEach(b => b.onclick = () => update(b.dataset.role, { role: b.dataset.to }));
  main.querySelectorAll('[data-access]').forEach(b => { let armed = b.dataset.off === 'false'; b.onclick = () => {
    if (!armed) { armed = true; b.textContent = 'Press again'; return; }
    update(b.dataset.access, { disabled: b.dataset.off === 'true' });
  }; });
}

/* ---------------- protocol ---------------- */
async function viewProtocol() {
  const p = await api('/instructor/api/protocol');
  const editable = isAdmin();
  const stepRow = (s, i) => `<div class="step"><span class="n">${i + 1}</span>
      <textarea class="ins" maxlength="400" aria-label="Instruction, step ${i + 1}">${esc(s.instruction)}</textarea>
      <select class="cond" aria-label="Check for step ${i + 1}">${Object.entries(CHECKS).map(([k, v]) => `<option value="${k}" ${k === s.condition ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <button type="button" class="rm" aria-label="Remove step ${i + 1}">×</button>
      <input class="why" type="text" maxlength="400" value="${esc(s.why || '')}" placeholder="Why this matters (shown to trainees)" aria-label="Reason, step ${i + 1}"></div>`;
  const sheet = p.count_sheets[0];
  main.innerHTML = `<section><p class="eyebrow">Protocol · version ${p.version}${p.is_standard ? ' · standard' : ''}</p>
      <h1><span class="thin">Your procedure,</span>your words.</h1>
      <p class="lede">This is what SPAI says at each station and what it checks before a step can advance. Changes reach every headset the next time it opens. Each instruction is read aloud, so keep it to a sentence or two.</p>
      ${editable ? '' : '<div class="banner"><span>Only an admin can change the protocol. You’re seeing what students see.</span></div>'}</section>
    <form id="pf" class="${editable ? '' : 'readonly'}">
      ${p.stations.map(st => `<section data-station="${st.key}"><h2>${STATION_NUM[st.key]} · ${esc(st.title)}</h2>
        <div class="card"><div class="steps">${st.steps.map(stepRow).join('')}</div>
        <button type="button" class="btn addstep" style="margin-top:16px">Add a step</button></div></section>`).join('')}
      <section><h2>Count sheet · ${esc(sheet.name)}</h2><div class="card"><p class="muted" style="margin-top:0">How many of each instrument belong in the tray. SPAI ticks them off at Tray Assembly as the camera recognises them.</p>
        <div class="rub">${(p.catalog || sheet.items).map(it => `<div class="field"><label for="cs-${it.key}">${esc(it.name)}</label><input type="number" min="0" max="20" id="cs-${it.key}" data-key="${it.key}" class="cs" value="${(sheet.items.find(x => x.key === it.key) || { count: 0 }).count}"></div>`).join('')}</div></div></section>
      <section><h2>Scoring</h2><div class="card"><p class="muted" style="margin-top:0">Every run starts at 100. These decide what's lost and what counts as competent.</p>
        <div class="rub">${Object.entries(RUBRIC).map(([k, label]) => `<div class="field"><label for="rb-${k}">${label}</label><input type="number" min="0" max="100" id="rb-${k}" data-key="${k}" class="rb" value="${p.rubric[k]}"></div>`).join('')}</div></div></section>
      ${editable ? `<section><div class="actions"><button class="btn solid">Save protocol</button><button type="button" class="btn" id="reset">Reset to standard</button></div>
        <p class="msg" id="pmsg" role="status"></p></section>` : ''}
    </form>`;
  if (!editable) return;
  const renumber = box => box.querySelectorAll('.step .n').forEach((n, i) => n.textContent = i + 1);
  // Assigned, not added: this view can render many times and must not stack handlers.
  main.onclick = e => {
    if (e.target.classList.contains('rm')) { const box = e.target.closest('.steps'); e.target.closest('.step').remove(); renumber(box); }
    if (e.target.classList.contains('addstep')) { const box = e.target.previousElementSibling; box.insertAdjacentHTML('beforeend', stepRow({ instruction: '', condition: 'manual', why: '' }, box.children.length)); box.lastElementChild.querySelector('textarea').focus(); }
  };
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const body = {
      name: p.is_standard ? 'Custom protocol' : p.name,
      stations: [...main.querySelectorAll('section[data-station]')].map(sec => ({ key: sec.dataset.station,
        steps: [...sec.querySelectorAll('.step')].map(row => ({ instruction: $('.ins', row).value, condition: $('.cond', row).value, why: $('.why', row).value })) })),
      count_sheets: [{ id: sheet.id, name: sheet.name, items: [...main.querySelectorAll('.cs')].map(i => ({ key: i.dataset.key, count: Number(i.value) })) }],
      rubric: Object.fromEntries([...main.querySelectorAll('.rb')].map(i => [i.dataset.key, Number(i.value)])),
    };
    try { const saved = await api('/instructor/api/protocol', { method: 'PUT', body: JSON.stringify(body) }); msg($('#pmsg'), `Saved as version ${saved.version}. Headsets pick it up next time they open.`, true); }
    catch (err) { msg($('#pmsg'), err.message); }
  };
  let armed = false;
  $('#reset').onclick = async e => {
    if (!armed) { armed = true; e.target.textContent = 'Press again to discard your changes'; return; }
    await api('/instructor/api/protocol/reset', { method: 'POST' }); render();
  };
}

/* ---------------- privacy ---------------- */
async function viewPrivacy() {
  const p = await api('/privacy');
  const list = items => `<ul class="plain">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  main.innerHTML = `<section><p class="eyebrow">Privacy + data</p><h1><span class="thin">What this server</span>keeps.</h1>
      <p class="lede">Written for an IT or privacy office. The same statement is available without signing in at <code>/privacy</code>.</p></section>
    <section class="grid2"><div class="card"><h2>Camera</h2><p class="muted" style="margin:0 0 24px">${esc(p.camera_frames)}</p>
        <h2>Stored</h2>${list(p.stored)}</div>
      <div class="card"><h2>Never collected</h2>${list(p.not_collected)}<h2 style="margin-top:24px">Other services</h2><p class="muted" style="margin:0">${esc(p.third_parties)}</p></div></section>
    <section class="grid2"><div class="card"><h2>Separation</h2><p class="muted" style="margin:0 0 24px">${esc(p.separation)}</p><h2>How long</h2><p class="muted" style="margin:0">${esc(p.retention)}</p></div>
      <div class="card"><h2>Erasing and exporting</h2>${list([p.erasure, p.export])}</div></section>`;
}

/* ---------------- router ---------------- */
async function render() {
  const [view, id] = (location.hash.slice(1) || 'class').split('/');
  if (view === 'invite' && id) { $('#nav').hidden = $('#who').hidden = $('#signout').hidden = true; return viewInvite(decodeURIComponent(id)); }
  $('#nav').hidden = $('#who').hidden = $('#signout').hidden = !signedIn;
  if (!signedIn) return viewSignIn();
  $('#who').innerHTML = `<b>${esc(status.instructor.name)}</b><br>${esc(status.organization.name)}`;
  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', a.dataset.view === (view === 'learner' || view === 'run' ? 'class' : view) ? 'page' : 'false'));
  main.onclick = null;
  try {
    if (view === 'learner' && id) await viewLearner(decodeURIComponent(id));
    else if (view === 'run' && id) await viewRun(decodeURIComponent(id));
    else if (view === 'headsets') await viewHeadsets();
    else if (view === 'team') await viewTeam();
    else if (view === 'protocol') await viewProtocol();
    else if (view === 'privacy') await viewPrivacy();
    else await viewClass();
    window.scrollTo(0, 0);
  } catch (err) {
    if (signedIn) main.innerHTML = `<section><a class="crumb" href="#class">← Class</a><h1 style="font-size:40px">Couldn't load that.</h1><p class="lede">${esc(err.message)}</p></section>`;
  }
}
async function boot() {
  status = await api('/instructor/status');
  signedIn = status.signed_in;
  render();
}
$('#signout').onclick = async () => { await api('/instructor/logout', { method: 'POST' }); signedIn = false; render(); };
addEventListener('hashchange', render);
boot();
</script>
</body>
</html>
